<head>
    <meta charset="UTF-8">

    <title>Pattern Recall - Cyber Grid Memory Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
/* ===== Shared top menu ===== */
/* Shared top menu bar for every game page.
   Layout: [ back to home ]   [ BRAIN ARCADE ]   [ sound ]
   Per-page width: set style="--nav-max: 520px" on the <nav>. */

.game-nav {
    position: relative;
    z-index: 20;
    width: 100%;
    max-width: var(--nav-max, 42rem);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    margin: 0 auto 16px;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    font-family: 'Kanit', 'Prompt', sans-serif;
}

.game-nav .nav-back {
    justify-self: start;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 14px;
    border-radius: 12px;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.4);
    color: #a5b4fc;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.25s ease;
}

.game-nav .nav-back:hover {
    background: rgba(99, 102, 241, 0.25);
    border-color: #818cf8;
    box-shadow: 0 0 14px rgba(129, 140, 248, 0.4);
    transform: translateY(-1px);
}

.game-nav .nav-back:active {
    transform: scale(0.96);
}

.game-nav .nav-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 2px;
    color: #fff;
    white-space: nowrap;
}

.game-nav .nav-brand i {
    color: #818cf8;
}

.game-nav .nav-actions {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 8px;
}

.game-nav .nav-icon-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid #334155;
    color: #cbd5e1;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s ease;
}

.game-nav .nav-icon-btn:hover {
    background: #334155;
}

.game-nav .nav-icon-btn:active {
    transform: scale(0.95);
}

.game-nav .nav-icon-btn.muted {
    color: #fb7185;
}

/* Secondary "back to home" link used inside game-over / win modals */
.btn-home-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 10px;
    padding: 12px 16px;
    border-radius: 16px;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.4);
    color: #a5b4fc;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.25s ease;
}

.btn-home-link:hover {
    background: rgba(99, 102, 241, 0.25);
    border-color: #818cf8;
}

@media (max-width: 480px) {
    .game-nav {
        padding: 8px 10px;
        gap: 6px;
    }
    .game-nav .nav-back span {
        display: none;
    }
    .game-nav .nav-back {
        padding: 0;
        width: 40px;
        justify-content: center;
    }
    .game-nav .nav-brand {
        font-size: 0.8rem;
        letter-spacing: 1px;
    }
}

</style>
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            min-height: 100vh;
            color: #f3f4f6;
            touch-action: manipulation;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Glassmorphism Containers */
        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Neon Grid Tiles Base */
        .tile {
            position: relative;
            background: rgba(31, 41, 55, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
            transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .tile:hover {
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .tile:active {
            transform: scale(0.95);
        }

        /* Tile Active/Flashing Colors & Glows */
        .tile-0.active {
            background-color: #06b6d4 !important; /* Cyan */
            border-color: #67e8f9 !important;
            box-shadow: 0 0 30px #06b6d4, inset 0 0 15px #cffaff;
        }

        .tile-1.active {
            background-color: #ec4899 !important; /* Pink */
            border-color: #f472b6 !important;
            box-shadow: 0 0 30px #ec4899, inset 0 0 15px #fce7f3;
        }

        .tile-2.active {
            background-color: #10b981 !important; /* Emerald */
            border-color: #34d399 !important;
            box-shadow: 0 0 30px #10b981, inset 0 0 15px #d1fae5;
        }

        .tile-3.active {
            background-color: #f59e0b !important; /* Amber */
            border-color: #fbbf24 !important;
            box-shadow: 0 0 30px #f59e0b, inset 0 0 15px #fef3c7;
        }

        .tile-4.active {
            background-color: #8b5cf6 !important; /* Purple */
            border-color: #a78bfa !important;
            box-shadow: 0 0 30px #8b5cf6, inset 0 0 15px #ede9fe;
        }

        .tile-5.active {
            background-color: #ef4444 !important; /* Red */
            border-color: #f87171 !important;
            box-shadow: 0 0 30px #ef4444, inset 0 0 15px #fee2e2;
        }

        .tile-6.active {
            background-color: #3b82f6 !important; /* Blue */
            border-color: #60a5fa !important;
            box-shadow: 0 0 30px #3b82f6, inset 0 0 15px #dbeafe;
        }

        .tile-7.active {
            background-color: #84cc16 !important; /* Lime */
            border-color: #a3e635 !important;
            box-shadow: 0 0 30px #84cc16, inset 0 0 15px #ecfccb;
        }

        .tile-8.active {
            background-color: #f97316 !important; /* Orange */
            border-color: #fb923c !important;
            box-shadow: 0 0 30px #f97316, inset 0 0 15px #ffedd5;
        }

        /* Pulse Animations */
        @keyframes error-shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake-board {
            animation: error-shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>

    <script>
        // --- Web Audio Synthesizer ---
        class SynthAudio {
            constructor() {
                this.ctx = null;
                // mute state is shared across all game pages
                this.muted = localStorage.getItem('arcade_muted') === '1';
                // Frequencies corresponding to 9 tiles (Major Pentatonic scale tones for harmonious sound)
                this.frequencies = [
                    261.63, // C4 (Tile 0)
                    293.66, // D4 (Tile 1)
                    329.63, // E4 (Tile 2)
                    392.00, // G4 (Tile 3)
                    440.00, // A4 (Tile 4)
                    523.25, // C5 (Tile 5)
                    587.33, // D5 (Tile 6)
                    659.25, // E5 (Tile 7)
                    783.99  // G5 (Tile 8)
                ];
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTileSound(index, duration = 0.3) {
                if (this.muted) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(this.frequencies[index % this.frequencies.length], this.ctx.currentTime);

                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }

            playFailSound() {
                if (this.muted) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.5);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.5);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.5);
                } catch (e) {}
            }

            playWinRoundSound() {
                if (this.muted) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        try {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                            gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.2);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start();
                            osc.stop(this.ctx.currentTime + 0.2);
                        } catch(e) {}
                    }, idx * 80);
                });
            }
        }

        const audio = new SynthAudio();

        // --- Game Logic & States ---
        let sequence = [];
        let playerStep = 0;
        let level = 1;
        let highScore = parseInt(localStorage.getItem('pattern_recall_high_score')) || 0;
        let isPlayingSequence = false;
        let isGameActive = false;

        // Icons for tiles decoration
        const tileIcons = [
            'fa-bolt', 'fa-gem', 'fa-fire',
            'fa-star', 'fa-atom', 'fa-moon',
            'fa-heart', 'fa-eye', 'fa-shield-halved'
        ];

        // DOM Elements
        const board = document.getElementById('game-board');
        const levelEl = document.getElementById('level-val');
        const bestEl = document.getElementById('best-val');
        const streakEl = document.getElementById('streak-val');
        const statusBadge = document.getElementById('status-badge');
        const startBtn = document.getElementById('start-btn');
        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');
        const modal = document.getElementById('game-over-modal');
        const modalContent = document.getElementById('modal-content');
        const modalRestart = document.getElementById('modal-restart');
        const finalLevelEl = document.getElementById('final-level');
        const finalBestEl = document.getElementById('final-best');

        // Init High Score display
        bestEl.textContent = highScore;

        // Render 3x3 Grid
        function renderBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const tile = document.createElement('div');
                tile.className = `tile tile-${i} flex items-center justify-center text-slate-500 text-2xl md:text-3xl`;
                tile.dataset.index = i;
                tile.innerHTML = `<i class="fa-solid ${tileIcons[i]} opacity-40 transition-opacity"></i>`;
                
                // Mouse & Touch events
                tile.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    handleTileClick(i);
                });

                board.appendChild(tile);
            }
        }

        // Flash a specific tile visually and plays sound
        function flashTile(index, duration = 350) {
            return new Promise((resolve) => {
                const tile = board.children[index];
                if (!tile) return resolve();

                tile.classList.add('active');
                const icon = tile.querySelector('i');
                if (icon) icon.classList.replace('opacity-40', 'opacity-100');
                
                audio.playTileSound(index, duration / 1000);

                setTimeout(() => {
                    tile.classList.remove('active');
                    if (icon) icon.classList.replace('opacity-100', 'opacity-40');
                    setTimeout(resolve, 100); // short gap between flashes
                }, duration);
            });
        }

        // Update status badge message
        function setStatus(text, colorClass = 'text-cyan-300 bg-cyan-500/10 border-cyan-500/30', pingColor = 'bg-cyan-400') {
            statusBadge.className = `inline-flex items-center gap-2 px-5 py-2 rounded-full font-orbitron text-xs md:text-sm font-bold shadow-lg transition-all duration-300 ${colorClass}`;
            statusBadge.innerHTML = `<span class="w-2.5 h-2.5 rounded-full ${pingColor} animate-ping"></span> ${text}`;
        }

        // Play entire sequence
        async function playSequence() {
            isPlayingSequence = true;
            setStatus('ตั้งใจจำลำดับแสงไฟ...', 'text-amber-300 bg-amber-500/10 border-amber-500/30', 'bg-amber-400');
            
            // Speed up slightly each level
            const speed = Math.max(220, 450 - (level * 20));

            await new Promise(r => setTimeout(r, 600));

            for (let i = 0; i < sequence.length; i++) {
                if (!isGameActive) return;
                await flashTile(sequence[i], speed);
            }

            isPlayingSequence = false;
            playerStep = 0;
            setStatus('ถึงตาคุณแล้ว! กดตามลำดับ', 'text-emerald-300 bg-emerald-500/10 border-emerald-500/30', 'bg-emerald-400');
        }

        // Start Next Level / Round
        function nextRound() {
            levelEl.textContent = level;
            streakEl.textContent = level - 1;

            // Generate a COMPLETELY NEW random sequence for the current level
            // Example: Level 1 = 1 item, Level 2 = 2 new items, Level 3 = 3 new items
            sequence = [];
            for (let i = 0; i < level; i++) {
                sequence.push(Math.floor(Math.random() * 9));
            }

            playSequence();
        }

        // Start New Game Session
        function startGame() {
            sequence = [];
            level = 1;
            isGameActive = true;
            levelEl.textContent = level;
            streakEl.textContent = 0;
            modal.classList.add('hidden');
            modal.classList.remove('opacity-100');
            modalContent.classList.remove('scale-100');
            startBtn.classList.add('opacity-50', 'pointer-events-none');
            nextRound();
        }

        // Player Click Handler
        async function handleTileClick(index) {
            if (!isGameActive || isPlayingSequence) return;

            // Flash player click tile
            flashTile(index, 200);

            // Check correctness
            if (index === sequence[playerStep]) {
                playerStep++;

                // Completed current round sequence!
                if (playerStep === sequence.length) {
                    isPlayingSequence = true;
                    audio.playWinRoundSound();
                    setStatus('ถูกต้อง! กำลังเข้าสู่ด่านถัดไป...', 'text-cyan-300 bg-cyan-500/10 border-cyan-500/30', 'bg-cyan-400');

                    // Check High Score
                    if (level > highScore) {
                        highScore = level;
                        localStorage.setItem('pattern_recall_high_score', highScore);
                        bestEl.textContent = highScore;
                    }

                    level++;
                    setTimeout(nextRound, 1000);
                }
            } else {
                // Game Over Triggered
                gameOver();
            }
        }

        // Game Over Handler
        function gameOver() {
            isGameActive = false;
            audio.playFailSound();
            board.classList.add('shake-board');

            setStatus('กดผิด! จบเกมแล้ว', 'text-rose-300 bg-rose-500/10 border-rose-500/30', 'bg-rose-500');

            setTimeout(() => {
                board.classList.remove('shake-board');
            }, 500);

            // Update modal stats
            finalLevelEl.textContent = level;
            finalBestEl.textContent = highScore;

            // Show Game Over Modal
            startBtn.classList.remove('opacity-50', 'pointer-events-none');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('opacity-100');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        // --- Event Listeners ---
        startBtn.addEventListener('click', startGame);
        modalRestart.addEventListener('click', startGame);

        function renderSoundBtn() {
            soundIcon.className = audio.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
            soundBtn.classList.toggle('muted', audio.muted);
        }

        soundBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            localStorage.setItem('arcade_muted', audio.muted ? '1' : '0');
            renderSoundBtn();
        });

        // Initialize Board on load
        window.onload = () => {
            renderSoundBtn();
            renderBoard();
        };
    </script>
</body>
</html>
