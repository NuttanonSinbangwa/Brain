<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Recall - เกมจำลำดับ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="nav.css">
    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 360px;
            margin: 0 auto 22px;
        }

        .tile {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-soft);
            border: 1px solid var(--line);
            border-radius: 16px;
            color: var(--muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
        }
        .tile i { opacity: 0.5; transition: opacity 0.15s; }
        .tile:hover { border-color: var(--accent); }
        .tile:active { transform: scale(0.96); }

        .tile.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
            transform: scale(1.03);
        }
        .tile.active i { opacity: 1; }

        .board.shake { animation: shake 0.4s both; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .status {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            background: var(--bg-soft);
            color: var(--muted);
            margin-bottom: 20px;
            transition: all 0.25s;
        }
        .status.watch { background: var(--accent-soft); color: var(--accent); }
        .status.go { background: var(--good-soft); color: var(--good); }
        .status.fail { background: var(--bad-soft); color: var(--bad); }
    </style>
</head>
<body>
    <nav class="game-nav" style="--nav-max: 520px">
        <a href="index.html" class="nav-back"><i class="fa-solid fa-arrow-left"></i><span>หน้าหลัก</span></a>
        <div class="nav-brand">BRAIN ARCADE</div>
        <div class="nav-actions">
            <button id="sound-btn" class="nav-icon-btn" aria-label="เปิด/ปิดเสียง"><i id="sound-icon" class="fa-solid fa-volume-high"></i></button>
        </div>
    </nav>

    <div class="panel" style="--w: 520px">
        <h1 class="title">Pattern Recall</h1>
        <p class="subtitle">จำลำดับช่องที่สว่างขึ้น แล้วกดตามให้ถูกต้อง</p>

        <div class="stats" style="--cols: 3">
            <div><span class="stat-label">Level</span><span id="level-val" class="stat-value">1</span></div>
            <div><span class="stat-label">Best</span><span id="best-val" class="stat-value">0</span></div>
            <div><span class="stat-label">Streak</span><span id="streak-val" class="stat-value">0</span></div>
        </div>

        <div id="status-badge" class="status">กด "เริ่มเกม" เพื่อท้าทายความจำ</div>

        <div id="game-board" class="board"></div>

        <button id="start-btn" class="btn"><i class="fa-solid fa-play"></i> เริ่มเกม</button>
    </div>

    <div id="game-over-modal" class="modal-backdrop">
        <div class="modal">
            <div class="icon bad"><i class="fa-solid fa-xmark"></i></div>
            <h2>จบเกม</h2>
            <p>คุณกดผิดลำดับ ลองใหม่อีกครั้งได้เลย</p>
            <div class="result-row">
                <div><span class="stat-label">ด่านที่ถึง</span><span id="final-level" class="num">1</span></div>
                <div><span class="stat-label">สถิติสูงสุด</span><span id="final-best" class="num">1</span></div>
            </div>
            <div class="actions">
                <button id="modal-restart" class="btn block"><i class="fa-solid fa-rotate-right"></i> ลองใหม่อีกครั้ง</button>
                <a href="index.html" class="btn btn-ghost block">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>

    <script>
        class SynthAudio {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.frequencies = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99];
            }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            tone(freq, type, duration, vol, delay = 0) {
                try {
                    const t = this.ctx.currentTime + delay;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);
                    gain.gain.setValueAtTime(vol, t);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + duration);
                } catch (e) {}
            }
            playTileSound(index, duration = 0.3) {
                if (this.muted) return;
                this.init();
                this.tone(this.frequencies[index % 9], 'sine', duration, 0.12);
            }
            playFailSound() {
                if (this.muted) return;
                this.init();
                try {
                    const t = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(160, t);
                    osc.frequency.exponentialRampToValueAtTime(70, t + 0.5);
                    gain.gain.setValueAtTime(0.15, t);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.5);
                } catch (e) {}
            }
            playWinRoundSound() {
                if (this.muted) return;
                this.init();
                [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 'triangle', 0.2, 0.1, i * 0.08));
            }
        }

        const audio = new SynthAudio();

        let sequence = [], playerStep = 0, level = 1;
        let highScore = parseInt(localStorage.getItem('pattern_recall_high_score')) || 0;
        let isPlayingSequence = false, isGameActive = false;

        const tileIcons = ['fa-bolt', 'fa-gem', 'fa-fire', 'fa-star', 'fa-atom', 'fa-moon', 'fa-heart', 'fa-eye', 'fa-shield-halved'];

        const board = document.getElementById('game-board');
        const levelEl = document.getElementById('level-val');
        const bestEl = document.getElementById('best-val');
        const streakEl = document.getElementById('streak-val');
        const statusBadge = document.getElementById('status-badge');
        const startBtn = document.getElementById('start-btn');
        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');
        const modal = document.getElementById('game-over-modal');
        const modalRestart = document.getElementById('modal-restart');
        const finalLevelEl = document.getElementById('final-level');
        const finalBestEl = document.getElementById('final-best');

        bestEl.textContent = highScore;

        function renderBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<i class="fa-solid ${tileIcons[i]}"></i>`;
                tile.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    handleTileClick(i);
                });
                board.appendChild(tile);
            }
        }

        function flashTile(index, duration = 350) {
            return new Promise((resolve) => {
                const tile = board.children[index];
                if (!tile) return resolve();
                tile.classList.add('active');
                audio.playTileSound(index, duration / 1000);
                setTimeout(() => {
                    tile.classList.remove('active');
                    setTimeout(resolve, 100);
                }, duration);
            });
        }

        function setStatus(text, cls = '') {
            statusBadge.className = 'status ' + cls;
            statusBadge.textContent = text;
        }

        async function playSequence() {
            isPlayingSequence = true;
            setStatus('ตั้งใจจำลำดับ...', 'watch');
            const speed = Math.max(220, 450 - level * 20);
            await new Promise(r => setTimeout(r, 600));
            for (let i = 0; i < sequence.length; i++) {
                if (!isGameActive) return;
                await flashTile(sequence[i], speed);
            }
            isPlayingSequence = false;
            playerStep = 0;
            setStatus('ถึงตาคุณแล้ว กดตามลำดับ', 'go');
        }

        function nextRound() {
            levelEl.textContent = level;
            streakEl.textContent = level - 1;
            sequence = [];
            for (let i = 0; i < level; i++) sequence.push(Math.floor(Math.random() * 9));
            playSequence();
        }

        function startGame() {
            sequence = [];
            level = 1;
            isGameActive = true;
            levelEl.textContent = level;
            streakEl.textContent = 0;
            modal.classList.remove('open');
            startBtn.classList.add('disabled');
            nextRound();
        }

        function handleTileClick(index) {
            if (!isGameActive || isPlayingSequence) return;
            flashTile(index, 200);

            if (index === sequence[playerStep]) {
                playerStep++;
                if (playerStep === sequence.length) {
                    isPlayingSequence = true;
                    audio.playWinRoundSound();
                    setStatus('ถูกต้อง กำลังไปด่านถัดไป', 'watch');
                    if (level > highScore) {
                        highScore = level;
                        localStorage.setItem('pattern_recall_high_score', highScore);
                        bestEl.textContent = highScore;
                    }
                    level++;
                    setTimeout(nextRound, 1000);
                }
            } else {
                gameOver();
            }
        }

        function gameOver() {
            isGameActive = false;
            audio.playFailSound();
            board.classList.add('shake');
            setStatus('กดผิด จบเกมแล้ว', 'fail');
            setTimeout(() => board.classList.remove('shake'), 500);

            finalLevelEl.textContent = level;
            finalBestEl.textContent = highScore;
            startBtn.classList.remove('disabled');
            startBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> เล่นอีกครั้ง';
            setTimeout(() => modal.classList.add('open'), 450);
        }

        startBtn.addEventListener('click', startGame);
        modalRestart.addEventListener('click', startGame);
        soundBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            soundIcon.className = audio.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
            soundBtn.classList.toggle('muted', audio.muted);
        });

        window.onload = renderBoard;
    </script>
</body>
</html>
