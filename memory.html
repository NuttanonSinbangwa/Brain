<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Match - จับคู่เอกสาร</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="nav.css">
    <script src="theme.js"></script>
    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .card {
            aspect-ratio: 1;
            perspective: 800px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner,
        .card.matched .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-front {
            background: var(--bg-soft);
            border: 1px solid var(--line);
            color: var(--muted);
            font-size: 1.3rem;
            transition: border-color 0.2s;
        }
        .card:hover .card-front { border-color: var(--accent); }

        .card-back {
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 1.7rem;
            transform: rotateY(180deg);
        }

        .card.matched .card-back {
            background: var(--good-soft);
            border-color: var(--good);
            color: var(--good);
        }

        @media (max-width: 480px) {
            .board { gap: 8px; }
        }
    </style>
</head>
<body>
    <nav class="game-nav" style="--nav-max: 520px">
        <a href="index.html" class="nav-back"><i class="fa-solid fa-arrow-left"></i><span>หน้าหลัก</span></a>
        <div class="nav-brand">WORKDESK</div>
        <div class="nav-actions">
            <button id="sound-btn" class="nav-icon-btn" aria-label="เปิด/ปิดเสียง"><i id="sound-icon" class="fa-solid fa-volume-high"></i></button>
        </div>
    </nav>

    <div class="panel" style="--w: 520px">
        <h1 class="title">Document Match</h1>
        <p class="subtitle">เปิดเอกสารเพื่อจับคู่รายการที่ตรงกันให้ครบ</p>

        <div class="stats" style="--cols: 2">
            <div>
                <span class="stat-label">เปิดแล้ว</span>
                <span id="moves-count" class="stat-value">0</span>
            </div>
            <div>
                <span class="stat-label">เวลาที่ใช้</span>
                <span id="timer" class="stat-value">00:00</span>
            </div>
        </div>

        <div class="board" id="board"></div>

        <button id="restart-btn" class="btn btn-ghost"><i class="fa-solid fa-rotate-right"></i> เริ่มใหม่</button>
    </div>

    <div id="win-modal" class="modal-backdrop">
        <div class="modal">
            <div class="icon good"><i class="fa-solid fa-check"></i></div>
            <h2>จับคู่ครบทุกรายการ</h2>
            <p>ตรวจสอบเอกสารครบถ้วนเรียบร้อย</p>
            <div class="result-row">
                <div>
                    <span class="stat-label">เวลาที่ใช้</span>
                    <span id="final-time" class="num">00:00</span>
                </div>
                <div>
                    <span class="stat-label">จำนวนที่เปิด</span>
                    <span id="final-moves" class="num">0</span>
                </div>
            </div>
            <div class="actions">
                <button id="modal-play-again" class="btn block">ทำอีกรอบ</button>
                <a href="index.html" class="btn btn-ghost block">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>

    <script>
        class SoundSystem {
            constructor() { this.ctx = null; this.muted = false; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
                if (this.muted) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }
            playFlip() { this.playTone(400, 'sine', 0.08, 0.06); }
            playMatch() {
                if (this.muted) return;
                [523.25, 659.25, 783.99].forEach((f, i) =>
                    setTimeout(() => this.playTone(f, 'triangle', 0.18, 0.1), i * 100));
            }
            playMismatch() {
                if (this.muted) return;
                setTimeout(() => this.playTone(220, 'triangle', 0.15, 0.06), 0);
                setTimeout(() => this.playTone(180, 'triangle', 0.2, 0.06), 120);
            }
            playWin() {
                if (this.muted) return;
                [440, 554.37, 659.25, 880].forEach((f, i) =>
                    setTimeout(() => this.playTone(f, 'triangle', 0.3, 0.12), i * 120));
            }
        }

        const sound = new SoundSystem();
        const icons = ['fa-file-lines', 'fa-envelope', 'fa-calendar-days', 'fa-chart-pie', 'fa-folder-open', 'fa-clipboard-check', 'fa-briefcase', 'fa-paperclip'];

        let cardsData = [], flippedCards = [], matchedPairs = 0, moves = 0;
        let timerInterval = null, secondsElapsed = 0, gameStarted = false, isProcessing = false;
        let flipBackTimer = null;

        const board = document.getElementById('board');
        const movesEl = document.getElementById('moves-count');
        const timerEl = document.getElementById('timer');
        const restartBtn = document.getElementById('restart-btn');
        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');
        const winModal = document.getElementById('win-modal');
        const finalTimeEl = document.getElementById('final-time');
        const finalMovesEl = document.getElementById('final-moves');
        const modalPlayAgain = document.getElementById('modal-play-again');

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function fmt(s) {
            return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        }

        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            timerEl.textContent = '00:00';
            timerInterval = setInterval(() => {
                secondsElapsed++;
                timerEl.textContent = fmt(secondsElapsed);
            }, 1000);
        }

        function initGame() {
            clearInterval(timerInterval);
            clearTimeout(flipBackTimer);   // a pending flip-back from the old game must not touch the new one
            timerEl.textContent = '00:00';
            moves = 0; matchedPairs = 0;
            gameStarted = false; isProcessing = false;
            flippedCards = [];
            movesEl.textContent = 0;
            winModal.classList.remove('open');

            cardsData = shuffle([...icons, ...icons]);
            board.innerHTML = '';
            cardsData.forEach((iconClass, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.icon = iconClass;
                card.dataset.index = index;
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front"><i class="fa-solid fa-question"></i></div>
                        <div class="card-back"><i class="fa-solid ${iconClass}"></i></div>
                    </div>`;
                card.addEventListener('click', () => handleCardClick(card));
                board.appendChild(card);
            });
        }

        function handleCardClick(card) {
            if (isProcessing || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            if (!gameStarted) { gameStarted = true; startTimer(); }

            card.classList.add('flipped');
            sound.playFlip();
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesEl.textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            isProcessing = true;
            const [c1, c2] = flippedCards;
            if (c1.dataset.icon === c2.dataset.icon) {
                sound.playMatch();
                c1.classList.add('matched');
                c2.classList.add('matched');
                matchedPairs++;
                flippedCards = [];
                isProcessing = false;
                if (matchedPairs === icons.length) {
                    clearInterval(timerInterval);
                    setTimeout(showWinModal, 600);
                }
            } else {
                sound.playMismatch();
                flipBackTimer = setTimeout(() => {
                    c1.classList.remove('flipped');
                    c2.classList.remove('flipped');
                    flippedCards = [];
                    isProcessing = false;
                }, 800);
            }
        }

        // --- storage: best time per user (map of username -> seconds) ---
        function getUser() {
            try { return JSON.parse(localStorage.getItem('arcade_current_user')) || { username: 'guest' }; }
            catch (e) { return { username: 'guest' }; }
        }
        function readBestMap() {
            try { return JSON.parse(localStorage.getItem('arcade_memory_scores') || '{}'); }
            catch (e) { return {}; }
        }
        function saveBestTime() {
            try {
                const user = getUser().username;
                const map = readBestMap();
                if (!map[user] || secondsElapsed < map[user]) {
                    map[user] = secondsElapsed;
                    localStorage.setItem('arcade_memory_scores', JSON.stringify(map));
                }
            } catch (e) {}
        }

        function showWinModal() {
            sound.playWin();
            saveBestTime();
            finalTimeEl.textContent = timerEl.textContent;
            finalMovesEl.textContent = moves;
            winModal.classList.add('open');
        }

        restartBtn.addEventListener('click', initGame);
        modalPlayAgain.addEventListener('click', initGame);
        soundBtn.addEventListener('click', () => {
            sound.muted = !sound.muted;
            soundIcon.className = sound.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
            soundBtn.classList.toggle('muted', sound.muted);
        });

        window.onload = initGame;
    </script>
</body>
</html>
