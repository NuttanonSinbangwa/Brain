<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workdesk - แบบทดสอบทั้งหมด</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="common.css">
    <script src="theme.js"></script>
    <style>
        .head { text-align: center; margin: 32px 0 22px; }
        .head h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; }
        .head p { color: var(--muted); font-weight: 300; margin-top: 8px; font-size: 0.92rem; }

        .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 22px; }
        .filt {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 8px 16px; border-radius: 999px;
            border: 1px solid var(--line); background: var(--surface); color: var(--muted);
            font: inherit; font-size: 0.82rem; font-weight: 500; cursor: pointer;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
        }
        .filt:hover { color: var(--ink); border-color: var(--accent); }
        .filt.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
        .filt .n { font-size: 0.72rem; opacity: 0.75; }

        .games { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .games .btn { text-decoration: none; }
        .count-line { text-align: center; color: var(--muted); font-size: 0.8rem; margin-bottom: 14px; }
        .empty-all { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; font-weight: 300; }

        @media (max-width: 640px) {
            .games { grid-template-columns: 1fr; }
            .head h1 { font-size: 1.7rem; }
        }
    </style>
</head>
<body>

    <nav class="game-nav hub-nav" style="--nav-max: 880px">
        <div class="nav-brand" style="justify-self:start; padding-left:8px;"><a href="index.html"><i class="fa-solid fa-briefcase" style="margin-right:8px;color:var(--accent)"></i>WORKDESK</a></div>
        <div class="nav-actions">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i><span>หน้าหลัก</span></a>
            <a href="games.html" class="nav-link on"><i class="fa-solid fa-list-check"></i><span>แบบทดสอบ</span></a>
            <div id="user-bar" style="display:flex;align-items:center;gap:6px;"></div>
            <button id="sound-btn" class="nav-icon-btn" aria-label="เปิด/ปิดเสียง"><i id="sound-icon" class="fa-solid fa-volume-high"></i></button>
        </div>
    </nav>

    <main class="page">
        <div class="head">
            <h1>แบบทดสอบทั้งหมด</h1>
            <p>เลือกงานที่ต้องการทำ ผลดีที่สุดของแต่ละงานจะแสดงบนการ์ด</p>
        </div>

        <div class="filters" id="filters" role="tablist" aria-label="กรองตามหมวด"></div>
        <div class="count-line" id="count-line"></div>
        <div class="games" id="games"></div>
    </main>

    <footer class="site-foot">Bboss</footer>

    <script src="common.js"></script>
    <script>
        const $ = (id) => document.getElementById(id);
        const { GAMES, CATS } = WD;
        const FILTERS = [{ id: 'all', name: 'ทั้งหมด', icon: 'fa-border-all' }]
            .concat(CATS.map((c) => ({ id: c.id, name: c.name, icon: c.icon })))
            .concat([{ id: 'new', name: 'ยังไม่เคยเล่น', icon: 'fa-star' }]);
        let filter = (location.hash || '').slice(1);
        if (!FILTERS.some((f) => f.id === filter)) filter = 'all';

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function matches(g, f, u) {
            if (f === 'all') return true;
            if (f === 'new') return g.best(u) === null;
            return g.cat === f;
        }

        function renderFilters() {
            const u = WD.name(), box = $('filters');
            box.textContent = '';
            FILTERS.forEach((f) => {
                const b = el('button', 'filt' + (f.id === filter ? ' on' : ''));
                b.type = 'button';
                b.setAttribute('role', 'tab');
                b.setAttribute('aria-selected', f.id === filter ? 'true' : 'false');
                const i = el('i', 'fa-solid ' + f.icon);
                const n = GAMES.filter((g) => matches(g, f.id, u)).length;
                b.append(i, el('span', '', f.name), el('span', 'n', String(n)));
                b.addEventListener('click', () => {
                    filter = f.id;
                    history.replaceState(null, '', f.id === 'all' ? location.pathname : '#' + f.id);
                    render();
                });
                box.append(b);
            });
        }

        function renderGames() {
            const u = WD.name(), grid = $('games');
            grid.textContent = '';
            const list = GAMES.filter((g) => matches(g, filter, u));
            $('count-line').textContent = 'แสดง ' + list.length + ' จาก ' + GAMES.length + ' งาน';
            if (!list.length) {
                grid.append(el('div', 'empty-all', filter === 'new' ? 'เล่นครบทุกงานแล้ว เก่งมาก!' : 'ไม่มีงานในหมวดนี้'));
                return;
            }
            list.forEach((g) => {
                const v = g.best(u);
                const card = el('div', 'game-card');

                const top = el('div');
                const bar = el('div', 'card-top');
                const icon = el('div', 'card-icon');
                icon.append(el('i', 'fa-solid ' + g.icon));
                const chips = el('span');
                chips.append(el('span', 'chip' + (v === null ? ' new' : ''), v === null ? 'ยังไม่เคยเล่น' : g.chip));
                bar.append(icon, chips);
                top.append(bar, el('h2', '', g.title), el('p', '', g.desc));

                const foot = el('div');
                const best = el('div', 'best');
                best.append(el('span', '', g.label), el('b', v === null ? 'none' : '', v === null ? '—' : v));
                const go = el('a', 'btn block');
                go.href = g.href;
                const gi = el('i', 'fa-solid fa-play');
                go.append(gi, document.createTextNode(' ' + (v === null ? 'เริ่มงาน' : 'เล่นอีกครั้ง')));
                foot.append(best, go);

                card.append(top, foot);
                grid.append(card);
            });
        }

        function render() { renderFilters(); renderGames(); }

        window.addEventListener('hashchange', () => {
            const h = location.hash.slice(1);
            if (FILTERS.some((f) => f.id === h)) { filter = h; render(); }
        });
        WD.onUser(render);
        WD.mount();
    </script>
</body>
</html>
